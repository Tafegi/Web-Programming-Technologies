<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Практична робота 1.3 — HTML-форма</title>
    <link rel="stylesheet" href="../css/practical1.3/Style1.3.css">
    <script src="../js/practical1.3/script1.3.js" defer></script>
</head>
<body>
<main class="page">
    <a class="back" href="../Index.html">← До практичних робіт</a>
    <header>
        <p class="eyebrow">Практична робота 1.3</p>
        <h1>Анкета студента</h1>
        <p>Заповніть форму. Поля зі знаком <span class="required">*</span> обов’язкові.</p>
    </header>

    <form id="student-form" method="post">
        <div class="input-row">
            <label class="wide-label" for="name">Ім’я <span class="required">*</span></label>
            <input type="text" id="name" name="name" maxlength="20" required autocomplete="given-name" aria-describedby="name-hint">
            <small id="name-hint">До 20 символів.</small>
        </div>

        <div class="input-row">
            <label class="wide-label" for="email">Email <span class="required">*</span></label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="student@example.com">
        </div>

        <div class="input-row">
            <label class="wide-label" for="password">Пароль <span class="required">*</span></label>
            <input type="password" id="password" name="password" required autocomplete="new-password">
        </div>

        <div class="input-row">
            <label class="wide-label" for="age">Вік</label>
            <input type="number" id="age" name="age" min="0" max="99" step="1" aria-describedby="age-hint">
            <small id="age-hint">Ціле число від 0 до 99.</small>
        </div>

        <fieldset class="input-row gender-row">
            <legend>Стать</legend>
            <div class="choices">
                <div><input type="radio" id="gender-male" name="gender" value="male"> <label for="gender-male">чол</label></div>
                <div><input type="radio" id="gender-female" name="gender" value="female"> <label for="gender-female">жін</label></div>
                <div><input type="radio" id="gender-unspecified" name="gender" value="unspecified" checked> <label for="gender-unspecified">не вказано</label></div>
            </div>
        </fieldset>

        <div class="input-row">
            <label class="wide-label" for="group">Група</label>
            <select id="group" name="group">
                <option value="KND-11">КНД-11</option>
                <option value="KND-12">КНД-12</option>
                <option value="SHID-11">ШІД-11</option>
            </select>
        </div>

        <div class="input-row">
            <label class="wide-label" for="biography">Біографія</label>
            <textarea id="biography" name="biography" rows="5" cols="40" placeholder="Розкажіть про себе"></textarea>
        </div>

        <div class="consent-row">
            <input type="checkbox" id="consent" name="consent" value="accepted" required>
            <label for="consent">Згода на обробку даних <span class="required">*</span></label>
        </div>

        <div class="actions">
            <button type="submit">Відправити</button>
        </div>
        <p id="form-status" role="status" aria-live="polite"></p>
    </form>
</main>
</body>
</html>
